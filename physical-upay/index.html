<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upay — выпуск карты</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0ed;color:#161714;font:14px/1.45 Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8ba83f;outline-offset:2px}.stage{display:flex;justify-content:center;align-items:flex-start;gap:35px;padding:32px 16px}.phone{width:430px;height:825px;flex:none;display:flex;flex-direction:column;position:relative;background:#f6f7f8;border-radius:34px;box-shadow:0 20px 60px #24372325,0 0 0 6px #262d29;overflow:hidden}.statusbar{height:45px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 26px 0;font-weight:700}.nav{height:63px;flex:none;display:flex;align-items:center;padding:0 20px;gap:12px;font-size:18px;font-weight:700}.back{width:40px;height:40px;border:0;border-radius:50%;background:white;font-size:27px}.nav span{flex:1;text-align:center}.nav i{width:40px}.scroll{flex:1;min-height:0;overflow-y:auto;padding:17px 20px 24px}.footer{padding:14px 20px 27px;flex:none;border-top:1px solid #e6e9e7}.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#161714;width:130px;height:5px;border-radius:9px}h1{font-size:27px;line-height:1.17;letter-spacing:-.7px;margin:0 0 13px}h2{font-size:17px;margin:20px 0 12px}.lead{font-size:13px;color:#737971;line-height:1.5;margin:0 0 20px}.art{height:215px;border-radius:22px;background:radial-gradient(ellipse at 93% 0%,#e7ffa3,transparent 54%),linear-gradient(132deg,#bcd86b,#789c37);padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 22px #61763530}.art b{font-size:29px;letter-spacing:-1.5px}.art .chip{width:35px;height:26px;border-radius:6px;background:linear-gradient(135deg,#e2cc92,#f1e1b0);border:1px solid #cfb783}.art small{font-weight:700;letter-spacing:2px}.line{display:flex;justify-content:space-between;gap:14px;align-items:center}.card-title{margin-top:17px}.card-title strong{font-size:16px}.sub{display:block;color:#878b87;font-size:12px;margin-top:3px}.tag{background:#e6f3d1;color:#4d692e;padding:6px 12px;border-radius:30px;font-size:11px;font-weight:700}.price{background:#fff;border-radius:14px;padding:16px;margin:17px 0}.price span{color:#737971}.price strong{font-size:19px}.notice{padding:14px;border-radius:15px;background:#e9eced;color:#59605c;font-size:12px;margin:12px 0}.notice.error{background:#fbe8e3;color:#a23d20}.notice.warn{background:#fff0db;color:#815820}.primary,.secondary{width:100%;border:0;min-height:53px;border-radius:15px;background:#cbf14a;font-weight:750;color:#151a0c;font-size:14px}.secondary{background:#e8ebea}.text-btn{display:block;width:100%;background:none;border:0;padding:12px;color:#577333;font-weight:700}.steps{display:flex;gap:6px;margin:0 0 20px}.steps b{height:4px;flex:1;background:#e0e3e1;border-radius:6px}.steps b.on{background:#a0bd46}.field{display:block;margin:0 0 16px}.label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px}.label small{font-size:11px;font-weight:400;color:#858e87}.input{background:#fff;border:1px solid #dfe4e1;border-radius:14px;width:100%;height:54px;padding:0 14px;font-size:15px;color:#161714}.input.bad{border-color:#ad4c37}.error-text{display:block;color:#b3482b;font-size:11px;margin-top:5px}.summary{background:white;border:1px solid #e9edeb;border-radius:16px;padding:0 15px}.summary .item{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #ecf0ed}.summary .item:last-child{border:0}.summary .item span{color:#777e77;font-size:12px;white-space:nowrap}.summary .item b{font-size:12px;text-align:right;max-width:68%;overflow-wrap:anywhere}.center{text-align:center;padding-top:44px}.icon{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 22px;border-radius:25px;background:#e6efd4;color:#5b862c;font-size:36px;font-weight:700}.icon.bad{background:#f9e7e4;color:#a44b2a}.center p{font-size:13px;color:#737971;line-height:1.5}.demo{width:305px;background:#fff;border:1px solid #e0e6e0;border-radius:20px;padding:20px;display:grid;gap:12px;margin-top:15px}.demo h3{margin:0;font-size:17px}.demo p{margin:0;font-size:11px;color:#879087}.demo label{font-size:11px;font-weight:700;color:#657265;display:grid;gap:5px}.demo select,.demo input:not([type=checkbox]){height:39px;width:100%;padding:8px;border:1px solid #dae2dc;border-radius:9px;background:#fff;color:#222;font-size:12px}.demo .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.demo .check{display:flex;align-items:center;gap:8px;font-weight:500}.demo button{border:0;background:#26382b;color:#fff;border-radius:10px;min-height:38px;font-size:12px;font-weight:700}.demo button.light{background:#eaf0e8;color:#536e4c}.demo pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f6f2;padding:11px;border-radius:9px;margin:0;font-size:10px;max-height:180px;overflow:auto}.demo a{font-size:11px;color:#587038;text-decoration:none}@media(max-width:760px){body{background:#f6f7f8}.stage{display:block;padding:0}.phone{width:100%;height:100dvh;min-height:600px;border-radius:0;box-shadow:none}.demo{display:none}}
</style></head><body><main class="stage"><section class="phone"><div class="statusbar"><span>9:41</span><span>●●● ▰</span></div><header class="nav"><button class="back" id="back" aria-label="Назад">‹</button><span id="title">Выпуск карты</span><i></i></header><div class="scroll" id="screen" aria-live="polite"></div><footer class="footer" id="footer"></footer><div class="home"></div></section><aside class="demo"><h3>Тестовые сценарии</h3><p>Управление вне интерфейса приложения</p><label>Результат заказа<select id="scenario"><option value="success">Успешный выпуск</option><option value="failed">Ошибка выпуска</option><option value="cancelled">Заказ отменён</option><option value="stock">Нет карт в выбранной стране</option><option value="networkId">Сбой сети, ID известен</option><option value="networkNoId">Сбой сети, ID неизвестен</option><option value="conflict">Конфликт адреса</option><option value="exists">Карта уже выпущена</option></select></label><div class="pair"><label>Цена из каталога<input id="priceInput" value="50 USD"></label><label>Template ID<input id="templateInput" type="number" min="1" value="123"></label></div><label class="check"><input type="checkbox" id="kyc" checked>Полная идентификация</label><label class="check"><input type="checkbox" id="available" checked>Доступно в каталоге</label><button id="fill">Заполнить тестовые данные</button><button class="light" id="reset">Сброс</button><p>Модель API — без реальных запросов</p><pre id="log"></pre><a href="https://rrpdsgn111126.github.io/wallet-ui-prototypes/ui-kit/" target="_blank" rel="noreferrer">Отдельный UI kit ↗</a></aside></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),screen=$('screen'),foot=$('footer'),countries={RU:'Россия',KZ:'Казахстан',AE:'ОАЭ'};
let stage='catalog',form={},errors={},message='',id=null,status='',saved=null,lock=false,retry=false,timer=0,logs=[];const cfg={price:'50 USD',template:123,kyc:true,available:true,scenario:'success'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(m,url,body)=>{logs.push(m+' '+url+(body?'\n'+JSON.stringify(body,null,2):''));$('log').textContent=logs.slice(-6).join('\n\n')};
const btn=(t,a,secondary=false,disabled=false)=>'<button class="'+(secondary?'secondary':'primary')+'" data-action="'+a+'"'+(disabled?' disabled':'')+'>'+t+'</button>';
const notice=(t,kind='')=>'<div role="status" class="notice '+kind+'">'+esc(t)+'</div>';
const steps=n=>'<div class="steps">'+[1,2,3].map(i=>'<b class="'+(i<=n?'on':'')+'"></b>').join('')+'</div>';
const art=()=>'<div class="art"><b>upay.</b><div class="chip"></div><small>PHYSICAL CARD</small></div>';
const line=(k,v)=>'<div class="item"><span>'+k+'</span><b>'+esc(v)+'</b></div>';
function field(k,label,placeholder,max,opt=false){return '<label class="field"><span class="label">'+label+(opt?'<small>Необязательно</small>':'')+'</span><input class="input'+(errors[k]?' bad':'')+'" maxlength="'+max+'" data-field="'+k+'" placeholder="'+esc(placeholder)+'" value="'+esc(form[k]||'')+'">'+(errors[k]?'<span class="error-text">'+esc(errors[k])+'</span>':'')+'</label>'}
function render(){
$('title').textContent={catalog:'Выпуск карты',delivery:'Доставка',review:'Подтверждение',status:'Выпуск карты',issued:'Моя карта'}[stage];$('back').style.visibility=['catalog','status','issued'].includes(stage)?'hidden':'visible';
let h='';
if(stage==='catalog'){h='<h1>Физическая карта Upay</h1><p class="lead">Оплачивайте покупки онлайн сразу после выпуска. Пластиковую карту доставят отдельно.</p>'+art()+'<div class="line card-title"><div><strong>Upay · Пластиковая</strong><span class="sub">Выпуск и доставка</span></div><span class="tag">Физическая</span></div><div class="line price"><span>Стоимость выпуска</span><strong>'+esc(cfg.price)+'</strong></div>'+notice('Доставка включена в стоимость выпуска.')+(!cfg.available?notice('Карта временно недоступна.','warn'):'')+(!cfg.kyc?notice('Для заказа нужна полная идентификация.','warn'):'')+(message?notice(message,'error'):'');foot.innerHTML=btn('Продолжить','choose',false,!cfg.available)}
if(stage==='delivery'){h=steps(2)+'<h1>Адрес доставки</h1><p class="lead">Укажите получателя и полный адрес для доставки карты.</p>'+field('recipient_name','ФИО получателя','Как в документе',255)+field('phone','Номер телефона','+7 999 000 00 00',32)+'<label class="field"><span class="label">Страна доставки</span><select class="input'+(errors.country_code?' bad':'')+'" data-field="country_code"><option value="">Выберите страну</option>'+Object.entries(countries).map(([k,v])=>'<option value="'+k+'"'+(form.country_code===k?' selected':'')+'>'+v+'</option>').join('')+'</select>'+(errors.country_code?'<span class="error-text">'+errors.country_code+'</span>':'')+'</label>'+field('city','Город','Город доставки',128)+field('address','Адрес','Улица, дом, корпус, квартира',512)+field('postal_code','Почтовый индекс','Индекс',32,true)+field('promo_code','Промокод','Если есть',32,true);foot.innerHTML=btn('Продолжить','validate')}
if(stage==='review'){h=steps(3)+'<h1>Проверьте данные</h1><p class="lead">После оформления изменить адрес доставки нельзя.</p><h2>Карта и оплата</h2><div class="summary">'+line('Тип','Физическая Upay')+line('Выпуск',cfg.price)+line('Доставка','Включена в стоимость')+'</div><h2>Доставка</h2><div class="summary">'+line('Получатель',form.recipient_name)+line('Телефон',form.phone)+line('Страна',countries[form.country_code])+line('Город',form.city)+line('Адрес',form.address)+(form.postal_code?line('Индекс',form.postal_code):'')+'</div>'+(form.promo_code?'<h2>Промокод</h2><div class="summary">'+line('Код',form.promo_code)+'</div>':'')+(message?notice(message,'error'):'')+'<div class="line price"><span>Итого к оплате</span><strong>'+esc(cfg.price)+'</strong></div>';foot.innerHTML=btn(retry?'Повторить запрос':'Оплатить выпуск',retry?'retry':'submit',false,lock)+'<button class="text-btn" data-action="edit"'+(lock?' disabled':'')+'>Изменить данные</button>'}
if(stage==='status'){if(status==='networkId'){h='<div class="center"><div class="icon bad">!</div><h1>Нет связи с сервером</h1><p>Номер заказа сохранён. Проверим его статус без повторного заказа.</p></div>';foot.innerHTML=btn('Проверить статус','check')}else if(['failed','cancelled'].includes(status)){h='<div class="center"><div class="icon bad">!</div><h1>'+(status==='failed'?'Не удалось выпустить карту':'Выпуск отменён')+'</h1><p>'+(status==='failed'?'Оформление не завершилось.':'Заказ был отменён.')+'</p></div>';foot.innerHTML=btn('Вернуться к картам','reset')}else{h='<div class="center"><div class="icon">◌</div><h1>'+(status==='processing'?'Выпускаем карту':'Ожидаем выпуск карты')+'</h1><p>Проверяем статус заказа. После выпуска карта станет доступна для онлайн-платежей.</p></div>'+notice('Данные доставки сохранены. Изменить адрес текущего заказа нельзя.');foot.innerHTML=btn('Проверить статус','poll',true)}h+='<p class="center" style="padding-top:10px;font-size:12px;color:#888">Заказ №'+esc(id)+'</p>'}
if(stage==='issued'){h='<div class="center" style="padding-top:14px"><div class="icon">✓</div><h1>Карта выпущена</h1><p>Карта активна для онлайн-платежей.</p></div><div style="margin:24px 0">'+art()+'</div><div class="summary">'+line('Карта','Физическая Upay')+line('Статус','Активна')+line('Заказ №',id)+'</div>'+notice('Пластиковую карту отправляют отдельно. Статус отправки и трек-номер здесь недоступны.');foot.innerHTML=btn('К выбору карт','reset')}
screen.innerHTML=h}
function validate(){errors={};for(let [key,n] of Object.entries({recipient_name:255,phone:32,city:128,address:512})){let v=(form[key]||'').trim();if(!v)errors[key]='Заполните поле';else if(v.length>n)errors[key]='Максимум '+n+' символов'}if(!countries[form.country_code])errors.country_code='Выберите страну';return !Object.keys(errors).length}
function payload(){let delivery={recipient_name:form.recipient_name.trim(),phone:form.phone.trim(),country_code:form.country_code,city:form.city.trim(),address:form.address.trim()};if((form.postal_code||'').trim())delivery.postal_code=form.postal_code.trim();let body={template_id:cfg.template,delivery};if((form.promo_code||'').trim())body.promo_code=form.promo_code.trim();return body}
function polling(){let t=++timer;stage='status';status='pending';render();setTimeout(()=>{if(t!==timer||stage!=='status')return;api('GET','/cards/order/'+id+'/status/');status='processing';render()},1000);setTimeout(()=>{if(t!==timer||stage!=='status')return;api('GET','/cards/order/'+id+'/status/');status=cfg.scenario==='failed'?'failed':cfg.scenario==='cancelled'?'cancelled':'success';if(status==='success'){api('GET','/cards/');stage='issued'}render()},2500)}
function submit(isRetry){if(lock)return;if(!isRetry)saved=payload();lock=true;message='';render();api('POST','/cards/order/',saved);setTimeout(()=>{lock=false;if(cfg.scenario==='stock'){message='Для выбранной страны нет доступных пластиковых карт.';render();return}if(cfg.scenario==='conflict'){message='Адрес отличается от уже оформленного заказа. Изменить его нельзя.';render();return}if(cfg.scenario==='exists'){id=456;api('GET','/cards/');stage='issued';render();return}if(cfg.scenario==='networkNoId'&&!isRetry){retry=true;message='Номер заказа не получен. Повторите запрос с теми же данными.';render();return}id=456;if(cfg.scenario==='networkId'&&!isRetry){stage='status';status='networkId';render();return}polling()},550)}
function reset(){timer++;stage='catalog';form={};errors={};message='';id=null;status='';saved=null;lock=false;retry=false;logs=[];api('GET','/cards/templates/');render()}
screen.addEventListener('input',ev=>{let k=ev.target.dataset.field;if(k){form[k]=ev.target.value;delete errors[k]}});screen.addEventListener('change',ev=>{let k=ev.target.dataset.field;if(k){form[k]=ev.target.value;delete errors[k]}});
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='choose'){if(!cfg.kyc){message='Для заказа нужна полная идентификация.';render();return}stage='delivery';message='';render()}if(a==='back'){stage=stage==='review'?'delivery':'catalog';render()}if(a==='validate'){if(validate()){stage='review';screen.scrollTop=0}render();if(stage==='delivery'&&Object.keys(errors).length)screen.querySelector('.bad')?.focus()}if(a==='edit'){stage='delivery';render()}if(a==='submit')submit(false);if(a==='retry')submit(true);if(a==='check')polling();if(a==='poll')api('GET','/cards/order/'+id+'/status/');if(a==='reset')reset()});
$('back').onclick=()=>{if(stage==='delivery'||stage==='review'){stage=stage==='review'?'delivery':'catalog';render()}};
$('scenario').onchange=ev=>cfg.scenario=ev.target.value;
$('priceInput').oninput=ev=>{cfg.price=ev.target.value||'—';if(['catalog','review'].includes(stage))render()};
$('templateInput').onchange=ev=>{cfg.template=Math.max(1,Number(ev.target.value)||123)};
$('kyc').onchange=ev=>{cfg.kyc=ev.target.checked;if(stage==='catalog')render()};
$('available').onchange=ev=>{cfg.available=ev.target.checked;if(stage==='catalog')render()};
$('fill').onclick=()=>{form={recipient_name:'Иван Иванов',phone:'+79990000000',country_code:'RU',city:'Москва',address:'ул. Примерная, д. 1, кв. 2',postal_code:'101000',promo_code:''};errors={};message='';if(stage==='catalog')stage='delivery';render()};
$('reset').onclick=reset;reset();
})();
</script></body></html>
