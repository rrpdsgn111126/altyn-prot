<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altyn · Выпуск физической карты Upay</title>
<style>
:root{--yellow:#ffd119;--bg:#f6f7f8;--white:#fff;--ink:#211e1d;--muted:#837f7f;--border:#e9ecf0;--error:#c44837;--accent:#d69500}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#e9ebee}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d69500;outline-offset:2px}
.scene{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;gap:18px;padding:24px 16px}
.mobile{width:375px;height:820px;flex:0 0 375px;background:white;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;box-shadow:0 12px 44px #26312122;position:relative}
.statusbar{flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:600;background:inherit}
.camera{height:24px;width:24px;border-radius:50%;background:var(--ink);position:absolute;top:8px;left:calc(50% - 12px)}
.nav{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:inherit;gap:12px}
.nav .back,.nav .chat{border:0;background:transparent;width:24px;height:24px;display:grid;place-items:center;padding:0;flex-shrink:0;color:var(--accent)}
.nav .back{font-size:30px;font-weight:300;line-height:15px}.nav .chat{font-size:20px}
.nav-title{flex:1;text-align:center;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{min-height:0;flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#d0d3d0 transparent}
.stage-inner{padding:16px}.stage-inner.wide{padding:0}
.bottom{flex:none;padding:12px 16px 14px;background:white}.bottom:empty{display:none}
.android-nav{height:48px;flex:0 0 48px;display:flex;justify-content:space-evenly;align-items:center;background:white;color:#211e1d}.android-nav span{display:inline-block}.android-nav span:nth-child(1){width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:9px solid var(--ink)}.android-nav span:nth-child(2){width:10px;height:10px;background:var(--ink);border-radius:50%}.android-nav span:nth-child(3){width:10px;height:10px;background:var(--ink);border-radius:1px}
.card-chooser{background:white;padding:16px 0;display:flex;justify-content:center}
.plastic{height:183px;width:300px;border-radius:17px;background:#67b961;position:relative;overflow:hidden;color:#fff;box-shadow:0 2px 8px #00000012;isolation:isolate}
.plastic:before{content:"А";position:absolute;left:-14px;top:-114px;width:300px;font-family:Arial,sans-serif;font-size:290px;font-weight:900;line-height:1;color:#fff;opacity:.14;transform:scaleX(.89);pointer-events:none}
.plastic .mark{position:absolute;top:21px;left:21px;display:grid;place-items:center;width:33px;height:33px;color:#fff;font-weight:900;font-size:30px;line-height:1;letter-spacing:-3px}
.plastic .product{position:absolute;right:18px;top:22px;font-size:14px;font-weight:800;letter-spacing:.5px}
.plastic .kind{position:absolute;top:68px;right:18px;font-size:11px;font-weight:600}
.plastic .number{position:absolute;bottom:19px;left:20px;font-size:15px;font-weight:550;letter-spacing:.7px}
.plastic .bottom-name{position:absolute;bottom:18px;right:20px;font-size:23px;font-weight:800;letter-spacing:-.8px;color:#fff}
.main-box{background:var(--bg);border-radius:12px;padding:0 16px;overflow:hidden}
.info-row{min-height:54px;padding:8px 0;border-bottom:1px solid #e9ecf0;display:flex;flex-direction:column;justify-content:center;gap:3px}.info-row:last-child{border-bottom:0}
.info-row .key{font-size:12px;line-height:16px;color:var(--muted)}.info-row .value{font-size:16px;line-height:23px;overflow-wrap:anywhere}
.info-row .value.sm{font-size:14px;line-height:21px;white-space:pre-line}.info-row .value.link{color:var(--accent)}
.group-title{font-size:18px;font-weight:600;margin:0 0 14px}
.card-explainer{padding:16px;background:#fcf8ec;border-radius:12px;margin-top:24px}
.card-explainer .key{color:var(--muted);font-size:12px;margin-bottom:5px}.card-explainer .body{font-size:14px;line-height:21px}
.promo{margin:16px 0 0;display:flex;gap:8px;align-items:center}
.promo input{min-width:0;flex:1;border-radius:11px;border:1px solid var(--border);height:54px;padding:0 13px;background:#fff;font-size:14px}
.promo button{border:0;background:var(--bg);border-radius:10px;height:46px;padding:0 12px;font-size:12px;font-weight:600}
.promo-note{font-size:12px;color:var(--accent);margin-top:7px;line-height:1.4}.promo-note.bad{color:var(--error)}
.primary,.secondary{border:0;border-radius:12px;min-height:54px;width:100%;padding:12px;font-size:14px;font-weight:600}
.primary{background:var(--yellow);color:var(--ink)}.primary:hover:not(:disabled){background:#f2c610}
.secondary{background:var(--bg);color:var(--ink)}
.foot-note{font-size:11px;text-align:center;color:var(--muted);margin:8px 4px 0;line-height:1.45}
.field{margin:0 0 12px;display:block}.label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin:0 0 7px}.label .optional{font-size:11px;font-weight:400;color:var(--muted)}
.input{display:block;width:100%;height:54px;border-radius:12px;border:1px solid var(--border);padding:0 14px;background:white;font-size:15px;color:var(--ink)}
.input::placeholder{color:#a5a5a5}.input.invalid{border-color:var(--error);background:#fffafa}.field-error{font-size:11px;color:var(--error);margin:4px 0 0;display:block}
.headline{font-size:19px;line-height:25px;font-weight:650;margin:2px 0 12px}.intro{font-size:13px;color:var(--muted);line-height:19px;margin:0 0 20px}
.list-group{background:var(--bg);border-radius:12px;padding:0 16px;margin-bottom:12px}.list-group h2{font-size:13px;font-weight:700;padding-top:15px;margin:0 0 2px}
.summary-row{padding:8px 0;border-bottom:1px solid var(--border);min-height:54px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.summary-row:last-child{border-bottom:0}.summary-row .key{font-size:12px;color:var(--muted)}.summary-row .value{font-size:16px;line-height:23px;overflow-wrap:anywhere;white-space:pre-line}
.warning{padding:14px 16px;background:#fcf8ec;border-radius:12px;font-size:13px;line-height:20px;margin:16px 0}
.error-message{padding:12px 14px;background:#fff0ef;color:#aa4432;border-radius:10px;font-size:13px;line-height:19px;margin:12px 0}
.consent{display:flex;align-items:flex-start;gap:9px;background:#fcf8ec;padding:16px;border-radius:12px;font-size:12px;line-height:18px;margin:16px 0}
.consent input{width:17px;height:17px;accent-color:var(--yellow);flex-shrink:0;margin-top:1px}
.center-state{text-align:center;padding:95px 15px 15px}.state-circle{height:80px;width:80px;border-radius:24px;background:#eff8d5;color:#4f8614;display:grid;place-items:center;font-size:38px;font-weight:700;margin:0 auto 21px}.state-circle.bad{color:#ad3e2c;background:#fae9e6}
.center-state h1{font-size:22px;margin:0 0 11px;font-weight:650}.center-state p{color:var(--muted);font-size:14px;line-height:21px;margin:0 0 10px}.order-number{font-size:12px;color:var(--muted);margin-top:17px}
.card-detail{padding:16px}.card-detail .card-chooser{padding:0 0 18px;background:transparent}.card-detail .plastic{width:300px}
.quick-actions{display:flex;gap:8px;justify-content:center;margin:14px 0 24px}.quick-actions button{background:var(--yellow);border:0;border-radius:12px;font-size:12px;font-weight:600;padding:11px 15px}
.card-badge{color:#5c7a2b;font-size:12px;background:#edf4dc;border-radius:20px;padding:6px 10px;display:inline-block;margin-bottom:13px}
.sheet-back{position:absolute;inset:0;background:#0009;display:flex;justify-content:flex-end;flex-direction:column;z-index:20}.sheet{background:white;border-radius:18px 18px 0 0;padding:16px 16px 24px;max-height:78%;overflow:auto}.handle{background:#d6d9d9;width:56px;height:4px;border-radius:10px;margin:0 auto 20px}.sheet h2{font-size:16px;margin:0 0 16px}.sheet h3{font-size:14px;margin:18px 0 8px}.sheet p{font-size:13px;line-height:20px;color:var(--muted);margin:0 0 10px}
.toolbox{width:310px;flex-shrink:0;background:white;border:1px solid #e5e8e9;border-radius:17px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.toolbox h3{margin:0;font-size:16px}.toolbox p{margin:0;font-size:11px;color:#78817d}.toolbox label{font-size:11px;color:#5c6660;font-weight:650;display:block}
.toolbox select,.toolbox input:not([type=checkbox]){margin-top:5px;width:100%;padding:8px 10px;min-height:40px;border:1px solid #dae0de;border-radius:9px;color:#232a25;background:white;font-size:12px}
.toolbox .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toolbox .check{display:flex;align-items:center;gap:8px;font-weight:500}.toolbox input[type=checkbox]{accent-color:#c2a000;height:15px;width:15px}
.toolbox button{border:0;border-radius:9px;background:#242e25;color:white;min-height:38px;font-size:12px;font-weight:600}.toolbox button.subtle{background:#eef0ee;color:#465345}
.toolbox pre{margin:0;max-height:160px;min-height:100px;overflow:auto;border-radius:8px;background:#f5f6f5;padding:11px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px;line-height:1.45}
.toolbox a{font-size:11px;color:#9c7400;text-decoration:none}
.annotation{width:260px;flex-shrink:0;align-self:flex-start;background:#fff;border:1px solid #e5e8e9;border-radius:17px;padding:18px;margin-top:12px;max-height:calc(100vh - 54px);overflow:auto;font-size:12px;line-height:1.45;order:2}.mobile{order:1}.toolbox{order:3}
.annotation h2{font-size:16px;margin:0 0 10px}.annotation h3{font-size:13px;margin:16px 0 7px}.annotation p{color:#68726e;margin:0 0 10px}.annotation ul{padding-left:17px;margin:0}.annotation li{margin:0 0 7px}.annotation .candidate{font-weight:650;color:#27342d}.annotation a{color:#866600;text-decoration:none}
@media(max-width:1150px) and (min-width:751px){.scene{gap:12px;padding:18px 12px}.annotation{width:235px}.toolbox{width:255px}}@media(max-width:950px) and (min-width:751px){.toolbox{display:none}.scene{gap:16px}.annotation{width:270px}}@media(max-width:750px){html,body{background:white}.scene{padding:0;display:block}.mobile{width:100%;height:100dvh;min-height:610px;border-radius:0;box-shadow:none;flex:none}.toolbox,.annotation{display:none}.plastic{max-width:calc(100vw - 48px)}}
</style>
</head>
<body>
<main class="scene">
<section class="mobile" id="mobile" aria-label="Интерактивный прототип выпуска физической карты Upay">
<div class="statusbar"><span>9:30</span><span>◆ ◢ ▰</span></div><div class="camera" aria-hidden="true"></div>
<header class="nav"><button class="back" type="button" id="back" aria-label="Назад">‹</button><span class="nav-title" id="title">Оформление карты</span><button class="chat" id="help" type="button" aria-label="Помощь">▢</button></header>
<div class="scroll" id="view" aria-live="polite"></div>
<footer class="bottom" id="bottom"></footer><div class="android-nav" aria-hidden="true"><span></span><span></span><span></span></div>
<div id="modal"></div>
</section>
<aside class="toolbox">
<h3>Тестовые сценарии</h3><p>Панель вне экранов приложения. Данные и статусы симулируются.</p>
<label>Результат оформления<select id="outcome">
<option value="success">Успешный выпуск</option><option value="failed">Ошибка выпуска</option><option value="cancelled">Заказ отменён</option><option value="stock">Нет карт для страны доставки</option><option value="network_known">Сбой сети, ID известен</option><option value="network_unknown">Сбой сети, ID неизвестен</option><option value="conflict">Данные доставки отличаются</option><option value="exists">Карта уже выпущена</option></select></label>
<div class="two"><label>Цена выпуска<input id="price" value="1 000 ₽"></label><label>Template ID<input id="template" type="number" min="1" value="123"></label></div>
<label>Сценарий промокода<select id="promo-mode"><option value="applied">Применён</option><option value="invalid">Не подошёл</option></select></label>
<label class="check"><input type="checkbox" id="kyc" checked> Полная идентификация пройдена</label>
<label class="check"><input type="checkbox" id="available" checked> Шаблон доступен</label>
<button id="fill" type="button">Заполнить тестовые реквизиты</button><button id="reset" class="subtle" type="button">Сбросить</button>
<p><strong>Модель вызовов API</strong> — без реальных запросов</p><pre id="log"></pre>
<a href="https://www.figma.com/design/n9eR5MzhUA8BpvjO9ciYgi/?node-id=14348-101393" target="_blank" rel="noreferrer">Исходный flow Figma ↗</a>
</aside>
<aside class="annotation" aria-label="Аннотации компонентов"><h2>Компоненты Figma</h2><p>Разметка активного экрана — справа от прототипа</p><div id="component-map"></div><p style="margin-top:16px"><a href="https://www.figma.com/design/eZfU7lRRxu3GYH2S2KRgMy/Altyn.Base?node-id=58-7058" target="_blank" rel="noreferrer">Библиотека Altyn.Base</a></p></aside>
</main>
<script>
(function(){
'use strict';
var $=function(x){return document.getElementById(x)};
var view=$('view'),footer=$('bottom'),modal=$('modal');
var countryNames={RU:'Россия',KZ:'Казахстан',AE:'ОАЭ'};
var model={price:'1 000 ₽',templateId:123,outcome:'success',promoMode:'applied',kyc:true,available:true};
var step='catalog',form={},errors={},notice='',promoState='',busy=false,orderId=null,orderStatus='',requestSnapshot=null,retryNeeded=false,session=0,logEntries=[];
function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(method,path,payload){logEntries.push(method+' '+path+(payload?'\n'+JSON.stringify(payload,null,2):''));$('log').textContent=logEntries.slice(-6).join('\n\n')}
function button(text,action,disabled,secondary){return '<button class="'+(secondary?'secondary':'primary')+'" type="button" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+text+'</button>'}
function card(issued){return '<div class="plastic" role="img" aria-label="Зелёная карта YouPay"><span class="mark">A</span>'+(issued?'<span class="number">•••• 2823</span>':'')+'<span class="bottom-name">YouPay</span></div>'}
function info(key,value,small){return '<div class="info-row"><span class="key">'+key+'</span><span class="value'+(small?' sm':'')+'">'+safe(value)+'</span></div>'}
function line(key,value){return '<div class="summary-row"><span class="key">'+key+'</span><span class="value">'+safe(value)+'</span></div>'}
function errorBanner(){return notice?'<div class="error-message" role="alert">'+safe(notice)+'</div>':''}
function field(id,label,placeholder,max,opt){return '<label class="field"><span class="label">'+label+(opt?'<span class="optional">Необязательно</span>':'')+'</span><input class="input'+(errors[id]?' invalid':'')+'" type="text" data-field="'+id+'" maxlength="'+max+'" value="'+safe(form[id]||'')+'" placeholder="'+safe(placeholder)+'">'+(errors[id]?'<span class="field-error">'+safe(errors[id])+'</span>':'')+'</label>'}
function catalog(){
return '<div class="stage-inner wide"><div class="card-chooser">'+card(false)+'</div><div class="stage-inner">'
+'<div class="main-box">'
+info('Где можно платить','Онлайн-оплата доступна сразу после заказа'+String.fromCharCode(10)+'Пластиковой картой можно пользоваться после получения',true)
+info('Тип карты','Физическая Upay')
+info('Стоимость выпуска',model.price)
+info('Доставка','Включена в стоимость')
+'</div>'
+'<div class="promo"><input id="promo-entry" aria-label="Промокод" maxlength="32" placeholder="Промокод" value="'+safe(form.promo_code||'')+'"><button type="button" data-action="apply-promo">Применить</button></div>'
+(promoState?'<div class="promo-note'+(promoState==='invalid'?' bad':'')+'">'+(promoState==='invalid'?'Промокод не подошёл':'Промокод применён')+'</div>':'')

+(!model.available?'<div class="error-message">Карта временно недоступна для выпуска</div>':'')
+(!model.kyc?'<div class="error-message">Для выпуска карты требуется полная идентификация</div>':'')
+errorBanner()+'</div></div>';
}
function delivery(){
return '<div class="stage-inner">'
+field('recipient_name','ФИО получателя','Фамилия Имя Отчество',255,false)
+field('phone','Номер телефона','+7 999 000-00-00',32,false)
+'<label class="field"><span class="label">Страна доставки</span><select class="input'+(errors.country_code?' invalid':'')+'" data-field="country_code"><option value="">Выберите страну</option>'
+Object.keys(countryNames).map(function(k){return '<option value="'+k+'"'+(form.country_code===k?' selected':'')+'>'+countryNames[k]+'</option>'}).join('')+'</select>'
+(errors.country_code?'<span class="field-error">'+safe(errors.country_code)+'</span>':'')+'</label>'
+field('city','Город','Город',128,false)+field('address','Адрес доставки','Улица, дом, корпус, квартира',512,false)+field('postal_code','Почтовый индекс','Индекс',32,true)
+'<div class="warning">Доставка входит в стоимость выпуска. Изменить адрес после создания заказа нельзя</div></div>';
}
function review(){
return '<div class="stage-inner">'
+'<div class="list-group">'+line('Карта','Физическая Upay')+line('Где можно платить','Онлайн-оплата доступна сразу после заказа'+String.fromCharCode(10)+'Пластиковой картой можно пользоваться после получения')+line('Стоимость выпуска',model.price)+line('Доставка','Включена в стоимость')+'</div>'
+'<div class="list-group">'+line('ФИО получателя',form.recipient_name)+line('Номер телефона',form.phone)+line('Страна',countryNames[form.country_code]||'')+line('Город',form.city)+line('Адрес доставки',form.address)+(form.postal_code?line('Почтовый индекс',form.postal_code):'')+'</div>'
+(form.promo_code?'<div class="list-group">'+line('Промокод',form.promo_code)+'</div>':'')
+errorBanner()
+'</div>';
}
function orderView(){
if(orderStatus==='network_known')return '<div class="stage-inner"><div class="center-state"><div class="state-circle bad">!</div><h1>Не удалось проверить статус</h1><p>Номер заказа известен. Проверим его статус без повторного оформления</p><div class="order-number">Заказ №'+safe(orderId)+'</div></div></div>';
if(orderStatus==='failed'||orderStatus==='cancelled')return '<div class="stage-inner"><div class="center-state"><div class="state-circle bad">!</div><h1>'+(orderStatus==='failed'?'Не удалось выпустить карту':'Выпуск отменён')+'</h1><p>'+(orderStatus==='failed'?'Оформление не завершилось. Попробуйте позже':'Заказ отменён')+'</p><div class="order-number">Заказ №'+safe(orderId)+'</div></div></div>';
return '<div class="stage-inner"><div class="center-state"><div class="state-circle">◌</div><h1>'+(orderStatus==='processing'?'Карта выпускается':'Ожидаем выпуск карты')+'</h1><p>Онлайн-оплата доступна сразу после заказа</p><div class="order-number">Заказ №'+safe(orderId)+'</div></div><div class="warning">Доставка пластикового экземпляра оформляется отдельно от его выпуска.</div></div>';
}
function issued(){
return '<div class="card-detail"><div class="card-chooser">'+card(true)+'</div><div class="card-badge">Карта активна · Онлайн-платежи доступны</div><div class="quick-actions"><button type="button" data-action="open-info">Как пользоваться</button></div>'
+'<div class="main-box">'+info('Тип карты','Физическая Upay')+info('Статус выпуска','Успешно')+info('Заказ',orderId)+info('Доставка','Пластик отправляют отдельно')+'</div>'
+'<div class="card-explainer"><div class="key">Информация</div><div class="body">Онлайн-оплата доступна сразу после заказа, пластиковой картой можно пользоваться после получения</div></div></div>';
}
function refreshFooter(){
if(step==='catalog')footer.innerHTML=button('Создать карту','choose',!model.available||!model.kyc);
else if(step==='delivery')footer.innerHTML=button('Продолжить','validate');
else if(step==='review')footer.innerHTML=button(retryNeeded?'Повторить запрос':'Подтвердить',retryNeeded?'retry':'submit',busy)+'<p class="foot-note">Доставка включена в стоимость выпуска</p>';
else if(step==='status')footer.innerHTML=orderStatus==='network_known'?button('Проверить статус','check'):orderStatus==='failed'||orderStatus==='cancelled'?button('Вернуться к картам','reset'):button('Проверить статус','poll',false,true);
else footer.innerHTML='';
}
function updateAnnotations(){var steps={catalog:[['navbar','Верхняя навигация'],['cards bank','Зелёная карта YouPay · референс Altyn App'],['list.mobile','Условия использования и стоимость'],['input.mobile','Поле промокода'],['Button.mobile','Кнопка создания карты · вариант уточнить']],delivery:[['navbar','Верхняя навигация'],['input.mobile','ФИО, телефон, город, адрес, индекс'],['Select · проверить','Страна доставки'],['Button.mobile','Продолжить · вариант уточнить']],review:[['navbar','Верхняя навигация'],['list.mobile','Детали карты, оплаты и доставки'],['Button.mobile','Подтвердить · вариант уточнить']],status:[['navbar','Верхняя навигация'],['Status · проверить','Обработка, ошибка, отмена'],['Button.mobile','Проверить статус · вариант уточнить']],issued:[['navbar','Верхняя навигация'],['cards bank','Выпущенная карта YouPay'],['list.mobile','Данные заказа'],['Bottom sheet · проверить','Информация о карте']]};var names={catalog:'Выбор карты',delivery:'Доставка',review:'Подтверждение',status:'Статус заказа',issued:'Карта'};var target=$('component-map');if(!target)return;target.innerHTML='<h3>'+names[step]+'</h3><ul>'+(steps[step]||[]).map(function(item){return '<li><span class="candidate">'+item[0]+'</span><div>'+item[1]+'</div></li>'}).join('')+'</ul><p>Названия без подтверждённого варианта требуют сверки с Altyn.Base</p>'}
function render(){
updateAnnotations();
$('title').textContent={catalog:'Оформление карты',delivery:'Доставка карты',review:'Выпуск карты',status:'Выпуск карты',issued:'Карта Алтын'}[step];
$('back').style.visibility=['catalog','status','issued'].includes(step)?'hidden':'visible';
$('help').style.visibility=step==='issued'?'visible':'hidden';
view.innerHTML=step==='catalog'?catalog():step==='delivery'?delivery():step==='review'?review():step==='status'?orderView():issued();
refreshFooter();
}
function valid(){
errors={};
for(var item of Object.entries({recipient_name:255,phone:32,city:128,address:512})){
var str=(form[item[0]]||'').trim();
if(!str)errors[item[0]]='Заполните поле';
else if(str.length>item[1])errors[item[0]]='Максимум '+item[1]+' символов';
}
if(!countryNames[form.country_code])errors.country_code='Выберите страну';
if((form.postal_code||'').length>32)errors.postal_code='Максимум 32 символа';
return !Object.keys(errors).length;
}
function payload(){
var delivery={recipient_name:(form.recipient_name||'').trim(),phone:(form.phone||'').trim(),country_code:form.country_code,city:(form.city||'').trim(),address:(form.address||'').trim()};
if((form.postal_code||'').trim())delivery.postal_code=form.postal_code.trim();
var body={template_id:model.templateId,delivery:delivery};
if((form.promo_code||'').trim())body.promo_code=form.promo_code.trim();
return body;
}
function move(to){step=to;render();view.scrollTop=0}
function poll(){
var current=++session;orderStatus='pending';move('status');
setTimeout(function(){if(current!==session||step!=='status')return;api('GET','/cards/order/'+orderId+'/status/');orderStatus='processing';render()},950);
setTimeout(function(){if(current!==session||step!=='status')return;api('GET','/cards/order/'+orderId+'/status/');orderStatus=model.outcome==='failed'?'failed':model.outcome==='cancelled'?'cancelled':'success';if(orderStatus==='success'){api('GET','/cards/');move('issued')}else render()},2450);
}
function submit(isRetry){
if(busy)return;if(!isRetry)requestSnapshot=payload();
busy=true;notice='';refreshFooter();api('POST','/cards/order/',requestSnapshot);
setTimeout(function(){
busy=false;
if(model.outcome==='stock'){notice='В выбранную страну сейчас нет доступных карт для доставки';move('review');return}
if(model.outcome==='conflict'){notice='Адрес отличается от уже оформленного заказа. Изменить существующий заказ нельзя';move('review');return}
if(model.outcome==='exists'){orderId=456;api('GET','/cards/');move('issued');return}
if(model.outcome==='network_unknown'&&!isRetry){retryNeeded=true;notice='Не удалось получить номер заказа. Повторите запрос с теми же данными';move('review');return}
orderId=456;
if(model.outcome==='network_known'&&!isRetry){orderStatus='network_known';move('status');return}
poll();
},600);
}
function reset(){++session;step='catalog';form={};errors={};notice='';promoState='';busy=false;orderId=null;orderStatus='';requestSnapshot=null;retryNeeded=false;logEntries=[];api('GET','/cards/templates/');render();view.scrollTop=0}
function openInfo(){modal.innerHTML='<div class="sheet-back" data-action="close-modal"><div class="sheet" role="dialog" aria-modal="true" aria-label="Как пользоваться картой"><div class="handle"></div><h2>Как пользоваться картой</h2><h3>Онлайн-платежи</h3><p>Онлайн-оплата доступна сразу после заказа</p><h3>Пластиковая карта</h3><p>Пластиковую карту доставляют отдельно, после получения ей можно пользоваться</p><h3>Данные доставки</h3><p>После создания заказа изменить адрес доставки нельзя</p>'+button('Понятно','close-modal')+'</div></div>'}
document.addEventListener('input',function(event){var key=event.target.dataset.field;if(key){form[key]=event.target.value;delete errors[key]}if(event.target.id==='promo-entry'){form.promo_code=event.target.value;promoState=''}});
document.addEventListener('change',function(event){var key=event.target.dataset.field;if(key){form[key]=event.target.value;delete errors[key]}});
document.addEventListener('click',function(event){
var btnTarget=event.target.closest('[data-action]');if(!btnTarget)return;
var action=btnTarget.dataset.action;
if(action==='close-modal'){if(event.target.closest('.sheet')&&event.target!==btnTarget)return;modal.innerHTML='';return}
if(action==='open-info'){openInfo();return}
if(action==='choose'){if(model.kyc&&model.available){notice='';move('delivery')}return}
if(action==='validate'){if(valid()){notice='';move('review')}else{render();view.querySelector('.invalid')?.focus()}return}
if(action==='submit'||action==='retry'){if(step==='review'&&!busy)submit(action==='retry');return}
if(action==='check'){poll();return}
if(action==='poll'){api('GET','/cards/order/'+orderId+'/status/');return}
if(action==='reset'){reset();return}
if(action==='apply-promo'){if((form.promo_code||'').trim())promoState=model.promoMode==='invalid'?'invalid':'applied';else promoState='';render();return}
});
$('back').addEventListener('click',function(){if(step==='review'&&!retryNeeded)move('delivery');else if(step==='delivery')move('catalog')});
$('help').addEventListener('click',openInfo);
$('outcome').addEventListener('change',function(e){model.outcome=e.target.value});
$('price').addEventListener('input',function(e){model.price=e.target.value||'—';if(step==='catalog'||step==='review')render()});
$('template').addEventListener('change',function(e){var n=Number(e.target.value);model.templateId=Number.isSafeInteger(n)&&n>0?n:123;e.target.value=model.templateId});
$('promo-mode').addEventListener('change',function(e){model.promoMode=e.target.value});
$('kyc').addEventListener('change',function(e){model.kyc=e.target.checked;if(step==='catalog')render()});
$('available').addEventListener('change',function(e){model.available=e.target.checked;if(step==='catalog')render()});
$('fill').addEventListener('click',function(){form={recipient_name:'Иван Иванов',phone:'+79990000000',country_code:'RU',city:'Москва',address:'ул. Примерная, д. 1, кв. 2',postal_code:'101000',promo_code:''};errors={};notice='';if(step==='catalog')move('delivery');else render()});
$('reset').addEventListener('click',reset);
reset();
})();
</script>
</body>
</html>
